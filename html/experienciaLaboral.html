<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Experiencia Laboral</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="mobile-frame">
        <header class="app-header">
            <a href="principal.html" class="btn-close-x" title="Cancelar y volver">X</a>
            <h1>Experiencia Laboral</h1>
            <p>Trayectoria profesional</p>
        </header>

        <main class="app-body">
            <form class="form-card" data-categoria="Experiencia laboral" novalidate>
                <div class="input-group">
                    <label for="nombreEmpresa">Nombre de la empresa *</label>
                    <input type="text" id="nombreEmpresa" required>
                </div>

                <div class="input-group">
                    <label for="rolEmpresa">Rol o puesto en dicha empresa *</label>
                    <input type="text" id="rolEmpresa" required>
                </div>

                <div class="input-group">
                    <label for="fechaEntrada">Fecha de entrada *</label>
                    <input type="date" id="fechaEntrada" required>
                </div>

                <div class="input-group">
                    <label for="fechaSalida">Fecha de salida *</label>
                    <input type="date" id="fechaSalida" required>
                </div>

                <div class="input-group">
                    <label for="direccionEmpresa">Dirección de la empresa *</label>
                    <input type="text" id="direccionEmpresa" required>
                </div>

                <div class="input-group file-input-box">
                    <label for="archivoLaboral">Comprobante de experiencia laboral (Obligatorio) *</label>
                    <input type="file" id="archivoLaboral" accept=".pdf,.jpg,.jpeg,.png" required>
                </div>

                <p id="mensajeFeedback" class="feedback-msg"></p>
                <button type="submit" class="btn-primary">Registrar experiencia laboral</button>
            </form>
        </main>
    </div>
    <script src="../js/formularios.js"></script>
</body>
</html>
